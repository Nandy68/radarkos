name: KosRadar 24/7 Ingestion Cron

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run KosRadar Autonomous Scraper
        env:
          KOSRADAR_URL: ${{ secrets.KOSRADAR_URL || 'https://radarkos.web.id' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/run-scraper.mjs

